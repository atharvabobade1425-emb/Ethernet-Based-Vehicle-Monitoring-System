<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1120" height="760" fill="#fff"/>
  <text x="560" y="28" text-anchor="middle" font-size="20" font-weight="bold">Communication Flow Diagram - UDP vs TCP</text>

  <!-- ================= UDP ================= -->
  <text x="250" y="62" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a78d6">Part A - UDP (connectionless)</text>
  <rect x="40" y="75" width="150" height="44" rx="6" fill="#e8f1fc" stroke="#2a78d6"/>
  <text x="115" y="95" text-anchor="middle" font-size="13" font-weight="bold">Vehicle ECU</text>
  <text x="115" y="111" text-anchor="middle" font-size="11">sender</text>
  <rect x="310" y="75" width="150" height="44" rx="6" fill="#fdeee7" stroke="#eb6834"/>
  <text x="385" y="95" text-anchor="middle" font-size="13" font-weight="bold">Dashboard ECU</text>
  <text x="385" y="111" text-anchor="middle" font-size="11">receiver</text>
  <line x1="115" y1="119" x2="115" y2="730" stroke="#999" stroke-dasharray="4 4"/>
  <line x1="385" y1="119" x2="385" y2="730" stroke="#999" stroke-dasharray="4 4"/>

  <g font-size="11.5">
    <text x="395" y="148">socket(AF_INET, SOCK_DGRAM)</text>
    <text x="395" y="164">bind(0.0.0.0:5000)</text>
    <text x="395" y="180">recvfrom()  ... blocks</text>
    <text x="10" y="210">socket(SOCK_DGRAM)</text>
    <text x="10" y="226">connect() - sets peer,</text>
    <text x="10" y="242">no packet sent</text>
  </g>
  <g font-size="12">
    <line x1="115" y1="275" x2="383" y2="275" stroke="#222" marker-end="url(#a)"/>
    <text x="250" y="268" text-anchor="middle">send(): VDATA seq=0</text>
    <line x1="115" y1="325" x2="383" y2="325" stroke="#222" marker-end="url(#a)"/>
    <text x="250" y="318" text-anchor="middle">send(): VDATA seq=1   (+1 s)</text>
    <line x1="115" y1="375" x2="383" y2="375" stroke="#222" marker-end="url(#a)"/>
    <text x="250" y="368" text-anchor="middle">send(): VDATA seq=2   (+1 s)</text>
    <text x="250" y="408" text-anchor="middle" font-size="18">...</text>
    <line x1="115" y1="445" x2="383" y2="445" stroke="#222" marker-end="url(#a)"/>
    <text x="250" y="438" text-anchor="middle">send(): VDATA seq=N</text>
  </g>
  <rect x="140" y="480" width="220" height="62" rx="6" fill="#f3f3f3" stroke="#bbb"/>
  <text x="250" y="500" text-anchor="middle" font-size="11.5">No handshake, no ACK,</text>
  <text x="250" y="516" text-anchor="middle" font-size="11.5">no retransmission, no teardown.</text>
  <text x="250" y="532" text-anchor="middle" font-size="11.5">Each datagram = one message.</text>
  <g font-size="12">
    <line x1="383" y1="600" x2="117" y2="600" stroke="#e34948" stroke-dasharray="6 3" marker-end="url(#a)"/>
    <text x="250" y="592" text-anchor="middle" fill="#a32020">ICMP Port Unreachable</text>
    <text x="250" y="618" text-anchor="middle" font-size="11" fill="#a32020">(only if Dashboard is NOT running)</text>
  </g>
  <text x="10" y="660" font-size="11.5">close()</text>
  <text x="395" y="660" font-size="11.5">close() on Ctrl+C / idle</text>

  <g transform="translate(90,0)">
  <!-- ================= TCP ================= -->
  <line x1="480" y1="50" x2="480" y2="740" stroke="#ddd"/>
  <text x="760" y="62" text-anchor="middle" font-size="16" font-weight="bold" fill="#c4501f">Part B - TCP (connection-oriented)</text>
  <rect x="545" y="75" width="150" height="44" rx="6" fill="#e8f1fc" stroke="#2a78d6"/>
  <text x="620" y="95" text-anchor="middle" font-size="13" font-weight="bold">Vehicle ECU</text>
  <text x="620" y="111" text-anchor="middle" font-size="11">client</text>
  <rect x="815" y="75" width="150" height="44" rx="6" fill="#fdeee7" stroke="#eb6834"/>
  <text x="890" y="95" text-anchor="middle" font-size="13" font-weight="bold">Dashboard ECU</text>
  <text x="890" y="111" text-anchor="middle" font-size="11">server</text>
  <line x1="620" y1="119" x2="620" y2="730" stroke="#999" stroke-dasharray="4 4"/>
  <line x1="890" y1="119" x2="890" y2="730" stroke="#999" stroke-dasharray="4 4"/>
  <g font-size="11">
    <text x="895" y="140">socket / bind / listen</text>
    <text x="895" y="155">accept() blocks</text>
    <text x="510" y="178">connect()</text>
  </g>
  <rect x="628" y="183" width="254" height="112" fill="#eef4fc" opacity="0.7"/>
  <text x="755" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#0b3d78">1. Connection establishment (3-way handshake)</text>
  <g font-size="12">
    <line x1="620" y1="220" x2="888" y2="220" stroke="#222" marker-end="url(#a)"/><text x="755" y="214" text-anchor="middle">SYN  seq=x</text>
    <line x1="890" y1="250" x2="622" y2="250" stroke="#222" marker-end="url(#a)"/><text x="755" y="244" text-anchor="middle">SYN-ACK  seq=y, ack=x+1</text>
    <line x1="620" y1="280" x2="888" y2="280" stroke="#222" marker-end="url(#a)"/><text x="755" y="274" text-anchor="middle">ACK  ack=y+1</text>
  </g>
  <text x="895" y="285" font-size="11">accept() returns</text>

  <rect x="628" y="305" width="254" height="200" fill="#f1f8f3" opacity="0.8"/>
  <text x="755" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d5c40">2. Data transfer (every 1 s)</text>
  <g font-size="12">
    <line x1="620" y1="345" x2="888" y2="345" stroke="#222" marker-end="url(#a)"/><text x="755" y="339" text-anchor="middle">PSH,ACK  VDATA seq=0 (81 B)</text>
    <line x1="890" y1="372" x2="622" y2="372" stroke="#666" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="755" y="366" text-anchor="middle" fill="#444">ACK</text>
    <line x1="620" y1="410" x2="888" y2="410" stroke="#222" marker-end="url(#a)"/><text x="755" y="404" text-anchor="middle">PSH,ACK  VDATA seq=1</text>
    <line x1="890" y1="437" x2="622" y2="437" stroke="#666" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="755" y="431" text-anchor="middle" fill="#444">ACK</text>
    <text x="755" y="465" text-anchor="middle" font-size="18">...</text>
    <text x="755" y="490" text-anchor="middle" font-size="11" fill="#444">lost segment -> retransmitted by kernel</text>
  </g>
  <text x="510" y="535" font-size="11">shutdown(SHUT_WR)</text>
  <rect x="628" y="520" width="254" height="150" fill="#fdf2ec" opacity="0.8"/>
  <text x="755" y="535" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a2a08">3. Connection termination</text>
  <g font-size="12">
    <line x1="620" y1="565" x2="888" y2="565" stroke="#222" marker-end="url(#a)"/><text x="755" y="559" text-anchor="middle">FIN, ACK</text>
    <text x="895" y="595" font-size="11">recv() = 0 -> close()</text>
    <line x1="890" y1="610" x2="622" y2="610" stroke="#222" marker-end="url(#a)"/><text x="755" y="604" text-anchor="middle">FIN, ACK  (ACK of FIN piggy-backed)</text>
    <line x1="620" y1="650" x2="888" y2="650" stroke="#222" marker-end="url(#a)"/><text x="755" y="644" text-anchor="middle">ACK</text>
  </g>
  <text x="510" y="680" font-size="11">close()</text>
  <text x="895" y="680" font-size="11">back to accept()</text>
  <text x="760" y="715" text-anchor="middle" font-size="11" fill="#a32020">If Dashboard not running: SYN -> RST,ACK  (connect() = ECONNREFUSED)</text>
  </g>
</svg>
