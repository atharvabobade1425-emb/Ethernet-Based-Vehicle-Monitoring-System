<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">System Architecture - Ethernet-Based Vehicle Monitoring System</text>

  <!-- Ubuntu host boundary -->
  <rect x="20" y="50" width="860" height="400" rx="14" fill="#f6f8fb" stroke="#8a94a6" stroke-dasharray="6 4"/>
  <text x="38" y="74" font-size="13" fill="#52514e">Ubuntu Linux host (both ECUs run in separate terminals; Ethernet emulated by loopback interface lo, 127.0.0.1)</text>

  <!-- Vehicle ECU -->
  <rect x="50" y="95" width="290" height="300" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="195" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b3d78">Vehicle ECU</text>
  <text x="195" y="140" text-anchor="middle" font-size="12" fill="#52514e">vehicle_ecu.c  (sender / client)</text>
  <rect x="70" y="155" width="250" height="70" rx="6" fill="#fff" stroke="#2a78d6"/>
  <text x="195" y="175" text-anchor="middle" font-size="13" font-weight="bold">Vehicle Data Generator</text>
  <text x="195" y="194" text-anchor="middle" font-size="12">Speed, Engine RPM, Steering Angle,</text>
  <text x="195" y="211" text-anchor="middle" font-size="12">Gear, Coolant Temp  (every 1 s)</text>
  <rect x="70" y="240" width="250" height="50" rx="6" fill="#fff" stroke="#2a78d6"/>
  <text x="195" y="260" text-anchor="middle" font-size="13" font-weight="bold">Message Encoder</text>
  <text x="195" y="278" text-anchor="middle" font-size="12">VDATA,seq,ts,...*checksum\n</text>
  <rect x="70" y="305" width="250" height="70" rx="6" fill="#fff" stroke="#2a78d6"/>
  <text x="195" y="325" text-anchor="middle" font-size="13" font-weight="bold">Socket Layer</text>
  <text x="195" y="344" text-anchor="middle" font-size="12">UDP: socket / connect / send</text>
  <text x="195" y="361" text-anchor="middle" font-size="12">TCP: socket / connect / send / shutdown</text>
  <line x1="195" y1="225" x2="195" y2="240" stroke="#333" marker-end="url(#arr)"/>
  <line x1="195" y1="290" x2="195" y2="305" stroke="#333" marker-end="url(#arr)"/>

  <!-- Dashboard ECU -->
  <rect x="560" y="95" width="290" height="300" rx="10" fill="#fdeee7" stroke="#eb6834" stroke-width="2"/>
  <text x="705" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a2a08">Dashboard ECU</text>
  <text x="705" y="140" text-anchor="middle" font-size="12" fill="#52514e">dashboard_ecu.c  (receiver / server)</text>
  <rect x="580" y="155" width="250" height="70" rx="6" fill="#fff" stroke="#eb6834"/>
  <text x="705" y="175" text-anchor="middle" font-size="13" font-weight="bold">Socket Layer</text>
  <text x="705" y="194" text-anchor="middle" font-size="12">UDP: socket / bind / recvfrom</text>
  <text x="705" y="211" text-anchor="middle" font-size="12">TCP: socket / bind / listen / accept / recv</text>
  <rect x="580" y="240" width="250" height="50" rx="6" fill="#fff" stroke="#eb6834"/>
  <text x="705" y="260" text-anchor="middle" font-size="13" font-weight="bold">Decoder &amp; Validator</text>
  <text x="705" y="278" text-anchor="middle" font-size="12">checksum, sequence gaps, latency</text>
  <rect x="580" y="305" width="250" height="70" rx="6" fill="#fff" stroke="#eb6834"/>
  <text x="705" y="325" text-anchor="middle" font-size="13" font-weight="bold">Display</text>
  <text x="705" y="344" text-anchor="middle" font-size="12">live values, warnings,</text>
  <text x="705" y="361" text-anchor="middle" font-size="12">statistics summary</text>
  <line x1="705" y1="225" x2="705" y2="240" stroke="#333" marker-end="url(#arr)"/>
  <line x1="705" y1="290" x2="705" y2="305" stroke="#333" marker-end="url(#arr)"/>

  <!-- Ethernet -->
  <rect x="380" y="300" width="140" height="90" rx="8" fill="#eef7ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="450" y="327" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d5c40">Ethernet / IP</text>
  <text x="450" y="347" text-anchor="middle" font-size="12">UDP port 5000</text>
  <text x="450" y="365" text-anchor="middle" font-size="12">TCP port 5001</text>
  <text x="450" y="382" text-anchor="middle" font-size="11" fill="#52514e">(lo / eth0)</text>
  <line x1="320" y1="340" x2="380" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M520,340 L545,340 L545,190 L580,190" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Wireshark -->
  <rect x="375" y="160" width="150" height="60" rx="8" fill="#fff8e6" stroke="#eda100" stroke-width="2"/>
  <text x="450" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b4a00">Wireshark</text>
  <text x="450" y="204" text-anchor="middle" font-size="12">capture on lo</text>
  <line x1="450" y1="220" x2="450" y2="300" stroke="#eda100" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arr)"/>

  <text x="450" y="432" text-anchor="middle" font-size="12" fill="#52514e">Data flow: generate -> encode -> socket send -> Ethernet frame -> socket receive -> decode/validate -> display</text>
</svg>
